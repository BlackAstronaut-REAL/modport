[package]
name = "mojmodelbridge-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust desktop application for MojModelBridge"

[dependencies]
anyhow = "1.0"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
mojmodelbridge = { path = ".." }
regex = "1.11"
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
