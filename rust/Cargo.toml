[package]
name = "mojmodelbridge"
version = "4.0.0-dev"
edition = "2021"
license = "MIT"
description = "Native Rust rewrite of the MojModelBridge Minecraft mod migration engine"

[lib]
name = "mojmodelbridge"
path = "src/lib.rs"

[[bin]]
name = "mojmodelbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rayon = "1.11"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
uuid = { version = "1.11", features = ["v5"] }
walkdir = "2.5"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.14"
