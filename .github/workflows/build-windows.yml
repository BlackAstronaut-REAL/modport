name: Build Windows desktop executable

on:
  push:
    paths:
      - 'app.py'
      - 'MojModelBridge.spec'
      - 'build_windows.bat'
      - 'oldVer/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Set up JDK for javap-backed tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run original engine regression tests
        run: |
          python -m pip install pytest
          python -m pytest tests -q
        working-directory: oldVer
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean MojModelBridge.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MojModelBridge-Windows-x64
          path: dist/MojModelBridge.exe
          if-no-files-found: error
          retention-days: 30
