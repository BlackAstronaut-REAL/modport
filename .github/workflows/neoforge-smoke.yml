name: Generated NeoForge mod smoke test

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/neoforge-smoke.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/neoforge-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build native CLI
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Convert a sample legacy mod and compile the generated NeoForge mod
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:RUNNER_TEMP "modport-smoke-source"
          $output = Join-Path $env:RUNNER_TEMP "modport-smoke-output"
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/java/demo") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/textures/Items") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/textures/Blocks") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/textures/gui") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/models/item") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/models/block") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/blockstates") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $source "src/main/resources/assets/smoke_mod/lang") | Out-Null
          $png = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p3sAAAAASUVORK5CYII=")
          [IO.File]::WriteAllBytes((Join-Path $source "src/main/resources/assets/smoke_mod/textures/Items/Ruby_Gem.PNG"), $png)
          [IO.File]::WriteAllBytes((Join-Path $source "src/main/resources/assets/smoke_mod/textures/Blocks/Ruby_Ore.PNG"), $png)
          [IO.File]::WriteAllBytes((Join-Path $source "src/main/resources/assets/smoke_mod/textures/gui/ruby_machine.png"), $png)

          Set-Content -Encoding utf8 -Path (Join-Path $source "mcmod.info") -Value '{"modid":"smoke_mod","name":"Modport Smoke Test","version":"1.0","mcversion":"1.12.2"}'

          @'
          item.rubyGem.name=Ruby Gem
          tile.rubyOre.name=Ruby Ore
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/resources/assets/smoke_mod/lang/en_US.lang")

          @'
          {
            "parent": "minecraft:item/handheld",
            "textures": {
              "layer0": "smoke_mod:Textures/Items/RUBY_GEM.PNG"
            }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/resources/assets/smoke_mod/models/item/ruby.json")

          @'
          {
            "parent": "minecraft:block/cube_all",
            "textures": {
              "all": "smoke_mod:Textures/Blocks/RUBY_ORE.PNG"
            }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/resources/assets/smoke_mod/models/block/ruby_ore.json")

          @'
          {
            "variants": {
              "": { "model": "smoke_mod:block/ruby_ore" }
            }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/resources/assets/smoke_mod/blockstates/ruby_ore.json")
          @'
          public class ModItems {
              public static final Item RUBY = new RubyItem();
              public static final Item ROAST = new ItemFoodRoast();
              public static void register() {
                  GameRegistry.registerItem(RUBY, "ruby");
                  GameRegistry.registerItem(ROAST, "roast");
              }
          }
          class RubyItem extends Item {
              public RubyItem() {
                  setMaxStackSize(16);
                  setUnlocalizedName("rubyGem");
                  setTextureName("smoke_mod:items/ruby_gem");
              }
              public void addInformation(ItemStack stack, World world, List<String> tooltip, ITooltipFlag flag) {
                  tooltip.add(EnumChatFormatting.GOLD + "Legendary " + EnumChatFormatting.BOLD + "Ruby");
              }
          }
          class ItemFoodRoast extends ItemFood {
              public ItemFoodRoast() {
                  super(6, 0.8F, true);
                  setAlwaysEdible();
                  setPotionEffect(new PotionEffect(Potion.getPotionById(10), 120, 1), 0.25F);
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/ModItems.java")

          @'
          public class ModBlocks {
              public static final Block RUBY_ORE = new RubyOre();
              public static final Block RUBY_MACHINE = new BlockRubyMachine();
              public static final Block FALLING_SAND = new FallingSand();
              public static void register() {
                  GameRegistry.registerBlock(RUBY_ORE, "ruby_ore");
                  GameRegistry.registerBlock(RUBY_MACHINE, "ruby_machine");
                  GameRegistry.registerBlock(FALLING_SAND, "falling_sand");
              }
          }
          class RubyOre extends Block {
              public RubyOre() {
                  setHardness(3.0F);
                  setResistance(5.0F);
                  setBlockName("rubyOre");
                  setBlockTextureName("smoke_mod:blocks/ruby_ore");
              }
              public List<ItemStack> getDrops(World world, BlockPos pos, IBlockState state, int fortune) {
                  return Collections.singletonList(new ItemStack(ModItems.RUBY, 2));
              }
          }
          class FallingSand extends BlockFalling {
              public FallingSand() { setHardness(0.5F); }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/ModBlocks.java")

          @'
          public class BlockRubyMachine extends Block {
              public boolean onBlockActivated(EntityPlayer player) {
                  player.openGui(Main.instance, 7, player.worldObj, 0, 0, 0);
                  return true;
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/BlockRubyMachine.java")

          @'
          class GuiHandler implements IGuiHandler {
              public Object getClientGuiElement(int id, EntityPlayer player, World world, int x, int y, int z) {
                  if (id == 7) return new GuiRubyMachine();
                  return null;
              }
              public Object getServerGuiElement(int id, EntityPlayer player, World world, int x, int y, int z) {
                  if (id == 7) return new ContainerRubyMachine();
                  return null;
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/GuiHandler.java")

          @'
          class GuiRubyMachine extends GuiContainer {
              private ResourceLocation texture = new ResourceLocation("smoke_mod", "textures/gui/ruby_machine.png");
              public GuiRubyMachine() { xSize = 194; ySize = 178; }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/GuiRubyMachine.java")

          @'
          class ContainerRubyMachine extends Container {
              public ContainerRubyMachine() {
                  addSlotToContainer(new Slot(tile, 0, 56, 17));
                  addSlotToContainer(new Slot(tile, 1, 116, 35));
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/ContainerRubyMachine.java")

          @'
          public class ModelRubyBeast extends ModelBase {
              public ModelRenderer body;
              public ModelRenderer head;
              public ModelRubyBeast() {
                  this.textureWidth = 64;
                  this.textureHeight = 32;
                  this.body = new ModelRenderer(this, 0, 0);
                  this.body.setRotationPoint(0, 4, 0);
                  this.body.addBox(-2, -3, -1, 4, 6, 2, 0.25F);
                  this.head = new ModelRenderer(this, 16, 0);
                  this.head.addBox(-1, -1, -1, 2, 2, 2);
                  this.body.addChild(this.head);
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/ModelRubyBeast.java")

          @'
          public class RenderRubyBeast {
              public ModelRubyBeast model = new ModelRubyBeast();
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/RenderRubyBeast.java")

          @'
          public class RenderRegistry {
              public static void register() {
                  RenderingRegistry.registerEntityRenderingHandler(EntityRubyBeast.class, new RenderRubyBeast());
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/RenderRegistry.java")

          @'
          class EntityRubyBeast extends EntityMob {
              public EntityRubyBeast() { }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/EntityRubyBeast.java")

          @'
          class EntityRegistry {
              public static void register() {
                  GameRegistry.registerModEntity(EntityRubyBeast.class, "ruby_beast", 1, null, 64, 3, true);
              }
          }
          '@ | Set-Content -Encoding utf8 -Path (Join-Path $source "src/main/java/demo/EntityRegistry.java")

          .\rust\target\release\mojmodelbridge.exe port-neoforge "$output" "$source"
          if ($LASTEXITCODE -ne 0) { throw "The Rust port-neoforge command failed." }

          $statusPath = Join-Path $output "modport/port-status.json"
          if (!(Test-Path $statusPath)) { throw "The converter did not write modport/port-status.json." }
          $status = Get-Content -Raw $statusPath | ConvertFrom-Json
          if ($status.converted.items -lt 1) { throw "Smoke port did not register its sample item." }
          if ($status.converted.blocks -lt 3) { throw "Smoke port did not register its sample blocks, GUI block, and falling block." }
          $nativeBlocksPath = Join-Path $output "src/main/java/com/modport/smoke_mod/registry/ModBlocks.java"
          $nativeBlocksJava = Get-Content -Raw $nativeBlocksPath
          if ($nativeBlocksJava -notmatch 'new FallingBlock\(') { throw "Legacy BlockFalling was not generated as a native FallingBlock." }
          $rubyLootPath = Join-Path $output "src/main/resources/data/smoke_mod/loot_tables/blocks/ruby_ore.json"
          if (!(Test-Path $rubyLootPath)) { throw "Registered item block-drop loot table was not generated." }
          $rubyLoot = Get-Content -Raw $rubyLootPath | ConvertFrom-Json
          if ($rubyLoot.pools[0].entries[0].name -ne "smoke_mod:ruby") { throw "Ruby Ore does not drop the registered Ruby item." }
          if ($rubyLoot.pools[0].entries[0].functions[0].count -ne 2) { throw "Ruby Ore drop count was not preserved." }
          $itemsJavaPath = Join-Path $output "src/main/java/com/modport/smoke_mod/registry/ModItems.java"
          $itemsJava = Get-Content -Raw $itemsJavaPath
          if ($itemsJava -notmatch 'MobEffectInstance\(MobEffects\.REGENERATION, 120, 1\)') {
              throw "Food potion effect was not emitted as a native MobEffectInstance."
          }
          $wolfFoodTagPath = Join-Path $output "src/main/resources/data/minecraft/tags/item/wolf_food.json"
          if (!(Test-Path $wolfFoodTagPath)) { throw "Legacy wolf-food membership was not emitted." }
          $wolfFoodTag = Get-Content -Raw $wolfFoodTagPath | ConvertFrom-Json
          if ($wolfFoodTag.values -notcontains "smoke_mod:roast") {
              throw "The generated roast item is missing from minecraft:wolf_food."
          }
          if ($status.converted.entity_placeholders -lt 1) { throw "Smoke port did not register its sample entity." }
          if ($status.converted.custom_guis -lt 1) { throw "Smoke port did not discover the block GUI." }
          if ($status.converted.entity_models -lt 1) { throw "Smoke port did not recover the mob model." }
          $menusFile = Join-Path $output "src/main/java/com/modport/smoke_mod/registry/ModMenus.java"
          $screensFile = Join-Path $output "src/main/java/com/modport/smoke_mod/client/ModScreens.java"
          $generatedBlockFile = Join-Path $output "src/main/java/com/modport/smoke_mod/registry/ModBlocks.java"
          $generatedModelFile = Join-Path $output "src/main/java/com/modport/smoke_mod/client/model/ConvertedEntityRubyBeastModel.java"
          if (!(Test-Path $menusFile) -or !(Test-Path $screensFile)) { throw "Smoke port did not generate a linked native menu and screen." }
          if (!(Get-Content -Raw $generatedBlockFile).Contains("serverPlayer.openMenu(provider)")) { throw "Generated machine block is not wired to its recovered GUI." }
          if (!(Test-Path $generatedModelFile)) { throw "Smoke port did not generate the mob model class." }
          $entityClass = Join-Path $output "src/main/java/com/modport/smoke_mod/entity/ConvertedEntityRubyBeast.java"
          if (!(Test-Path $entityClass)) { throw "Smoke port did not generate the sample entity class." }
          $rendererFile = Join-Path $output "src/main/java/com/modport/smoke_mod/client/ModEntityRenderers.java"
          if (!(Test-Path $rendererFile)) { throw "Smoke port did not generate the entity renderer class." }
          $rendererSource = Get-Content -Raw $rendererFile
          if ($rendererSource -notmatch 'import com\.modport\.smoke_mod\.entity\.\*;') {
              throw "Generated entity renderer is missing its generated entity package import."
          }
          if ($rendererSource -notmatch 'MobRenderer<ConvertedEntityRubyBeast') {
              throw "Generated entity renderer does not reference the sample entity type."
          }
          if ($rendererSource -notmatch 'registerLayerDefinition\(ConvertedEntityRubyBeastModel\.LAYER_LOCATION') {
              throw "Generated entity renderer did not register the recovered mob model layer."
          }
          if ($rendererSource -notmatch 'MobRenderer<ConvertedEntityRubyBeast,\s*ConvertedEntityRubyBeastModel<ConvertedEntityRubyBeast>>') {
              throw "Generated entity renderer did not use the recovered custom model type."
          }
          if ($rendererSource -match 'HumanoidModel<ConvertedEntityRubyBeast>') {
              throw "Generated mob unexpectedly fell back to the humanoid model despite a source renderer/model registration."
          }
          $generatedLoreFile = Join-Path $output "src/main/java/com/modport/smoke_mod/item/LoreRuby.java"
          if (!(Test-Path $generatedLoreFile)) { throw "Source item tooltip lore was not generated." }
          $generatedLore = Get-Content -Raw $generatedLoreFile
          if ($generatedLore -notmatch 'ChatFormatting\.GOLD' -or $generatedLore -notmatch 'withBold\(true\)') {
              throw "Generated item lore lost its legacy color/bold formatting."
          }
          $itemModelFile = Join-Path $output "src/main/resources/assets/smoke_mod/models/item/ruby.json"
          $blockModelFile = Join-Path $output "src/main/resources/assets/smoke_mod/models/block/ruby_ore.json"
          $itemTextureFile = Join-Path $output "src/main/resources/assets/smoke_mod/textures/items/ruby_gem.png"
          $blockTextureFile = Join-Path $output "src/main/resources/assets/smoke_mod/textures/blocks/ruby_ore.png"
          if (!(Test-Path $itemModelFile) -or !(Test-Path $blockModelFile)) { throw "Copied item/block model JSON was lost." }
          if (!(Test-Path $itemTextureFile) -or !(Test-Path $blockTextureFile)) { throw "Legacy mixed-case textures were not normalized into valid target paths." }
          $itemModel = Get-Content -Raw $itemModelFile | ConvertFrom-Json
          $blockModel = Get-Content -Raw $blockModelFile | ConvertFrom-Json
          if ($itemModel.textures.layer0 -ne "smoke_mod:items/ruby_gem") { throw "Held item model texture was not remapped to its real texture." }
          if ($itemModel.parent -ne "minecraft:item/handheld") { throw "Held item model parent was not preserved." }
          if ($blockModel.textures.all -ne "smoke_mod:blocks/ruby_ore") { throw "Block model texture was not remapped to its real texture." }
          $languageFile = Join-Path $output "src/main/resources/assets/smoke_mod/lang/en_us.json"
          if (!(Test-Path $languageFile)) { throw "Legacy .lang file was not migrated into target JSON language data." }
          $language = Get-Content -Raw $languageFile | ConvertFrom-Json
          if ($language.'item.smoke_mod.ruby' -ne "Ruby Gem") { throw "The registry item name did not resolve through its unlocalized-name alias." }
          if ($language.'block.smoke_mod.ruby_ore' -ne "Ruby Ore") { throw "The block display name did not resolve through its unlocalized-name alias." }
          if (!(Test-Path (Join-Path $output "src/main/java/com/modport/smoke_mod/NeoForgeMod.java"))) {
              throw "Smoke port did not produce its NeoForge @Mod entrypoint."
          }
          if (!(Test-Path (Join-Path $output "src/main/resources/META-INF/neoforge.mods.toml"))) {
              throw "Smoke port did not produce NeoForge mod metadata."
          }

          Push-Location $output
          try {
              .\gradlew.bat build --no-daemon --stacktrace
              if ($LASTEXITCODE -ne 0) { throw "The generated NeoForge project failed Gradle build." }
          }
          finally {
              Pop-Location
          }
          $jar = Get-ChildItem (Join-Path $output "build/libs") -Filter "*.jar" | Select-Object -First 1
          if ($null -eq $jar) { throw "Gradle succeeded without producing the converted mod JAR." }
          Write-Host "Generated smoke-test mod: $($jar.FullName)"
      - name: Upload the generated test mod
        uses: actions/upload-artifact@v4
        with:
          name: Modport-NeoForge-smoke-mod
          path: ${{ runner.temp }}/modport-smoke-output/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
